[project]
name = "or-decision-lab"
version = "0.1.0"
description = "OR Decision Lab: one car plant, nine decisions, each solved by Google OR-Tools and explained in words, math and code."
requires-python = ">=3.10"
dependencies = [
    "ortools>=9.10",  # GLOP, SCIP, CP-SAT, routing, graph solvers
    "pyyaml>=6.0",
    "simpy>=4.1",    # discrete-event simulation
    "scipy>=1.11",   # distribution fitting, KS test, t-intervals
]

[project.optional-dependencies]
app = ["streamlit>=1.50", "pandas>=2", "altair>=5"]   # the app: streamlit run app/Home.py
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orlab = ["*.yaml"]

